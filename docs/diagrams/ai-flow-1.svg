<rect x="248.0" y="98.0" width="304.0" height="68.0" rx="16" fill="#DDE8F0" stroke="#40556B"/>
<text x="400" y="136.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">START: Select PDF, DOCX or TXT</text>
<rect x="248.0" y="202.0" width="304.0" height="68.0" rx="3" fill="#EAF2FB" stroke="#40556B"/>
<text x="400" y="233.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">Extract embedded text; preserve page</text>
<text x="400" y="247.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">markers. Apply configured text limit.</text>
<polygon points="400,300.0 552.0,344.0 400,388.0 248.0,344.0" fill="#FFF2CC" stroke="#40556B"/>
<text x="400" y="341.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">Readable text and connection settings</text>
<text x="400" y="355.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">ready?</text>
<rect x="680.0" y="310.0" width="240" height="68.0" rx="3" fill="#FCE4E4" stroke="#40556B"/>
<text x="800" y="334.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">Show input/configuration</text>
<text x="800" y="348.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">error. Correct input and try</text>
<text x="800" y="362.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">again.</text>
<rect x="248.0" y="426.0" width="304.0" height="68.0" rx="3" fill="#EAF2FB" stroke="#40556B"/>
<text x="400" y="450.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">User selects Extract fields. Send text</text>
<text x="400" y="464.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">and shared extraction prompt to</text>
<text x="400" y="478.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">Bedrock.</text>
<rect x="248.0" y="526.0" width="304.0" height="84.0" rx="3" fill="#EDE7FA" stroke="#40556B"/>
<text x="400" y="558.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">AI returns section values, separate</text>
<text x="400" y="572.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">Special Instructions, and provider</text>
<text x="400" y="586.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">records as JSON.</text>
<polygon points="400,644.0 552.0,692.0 400,740.0 248.0,692.0" fill="#FFF2CC" stroke="#40556B"/>
<text x="400" y="689.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">Parse and normalize output (pages</text>
<text x="400" y="703.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">2-3). Accepted JSON and field types?</text>
<polygon points="800,648.0 920.0,692.0 800,736.0 680.0,692.0" fill="#FFF2CC" stroke="#40556B"/>
<text x="800" y="696.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">First invalid response?</text>
<rect x="680.0" y="486.0" width="240" height="68.0" rx="3" fill="#EAF2FB" stroke="#40556B"/>
<text x="800" y="517.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">Retry once with a complete-</text>
<text x="800" y="531.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">JSON reminder.</text>
<rect x="680.0" y="802.0" width="240" height="68.0" rx="3" fill="#FCE4E4" stroke="#40556B"/>
<text x="800" y="833.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">Show extraction error. No</text>
<text x="800" y="847.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">completed result.</text>
<rect x="248.0" y="794.0" width="304.0" height="84.0" rx="3" fill="#EAF2FB" stroke="#40556B"/>
<text x="400" y="826.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">Compute completeness and NEXT STEP</text>
<text x="400" y="840.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">(page 4). Missing facts do not trigger</text>
<text x="400" y="854.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">a retry.</text>
<rect x="248.0" y="918.0" width="304.0" height="84.0" rx="3" fill="#EAF2FB" stroke="#40556B"/>
<text x="400" y="950.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">Display five sections + four optional</text>
<text x="400" y="964.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">extras. Export grouped JSON, CSV or</text>
<text x="400" y="978.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">TXT.</text>
<rect x="248.0" y="1050.0" width="304.0" height="76.0" rx="16" fill="#DDE8F0" stroke="#40556B"/>
<text x="400" y="1085.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">END: Human reviews results. No</text>
<text x="400" y="1099.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">automatic CMS handoff.</text>
<rect x="676.0" y="940.0" width="248.0" height="200.0" rx="3" fill="#F4F6F8" stroke="#40556B"/>
<text x="800" y="974.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#142B42">AI interprets document context;</text>
<text x="800" y="988.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#142B42">Python validates structure,</text>
<text x="800" y="1002.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#142B42">applies fallback and checks</text>
<text x="800" y="1016.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#142B42">completeness.</text>
<text x="800" y="1030.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#142B42"></text>
<text x="800" y="1044.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#142B42">PDF extraction uses embedded</text>
<text x="800" y="1058.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#142B42">text, not OCR. API/transport</text>
<text x="800" y="1072.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#142B42">failures surface as errors;</text>
<text x="800" y="1086.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#142B42">malformed-output retry is</text>
<text x="800" y="1100.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#142B42">separate from client transport</text>
<text x="800" y="1114.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#142B42">retries.</text>
