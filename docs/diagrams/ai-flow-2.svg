<text x="760.0" y="258.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">Keep primary value. Never</text>
<text x="760.0" y="272.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">overwrite it with Special</text>
<text x="760.0" y="286.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">Instructions.</text>
<polygon points="360.0,360.0 512.0,412.0 360.0,464.0 208.0,412.0" fill="#FFF2CC" stroke="#40556B"/>
<text x="360.0" y="409.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">Special Instructions fallback allowed</text>
<text x="360.0" y="423.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">for this field?</text>
<rect x="624.0" y="378.0" width="272.0" height="68.0" rx="3" fill="#F4F6F8" stroke="#40556B"/>
<text x="760.0" y="416.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#142B42">Use Not found</text>
