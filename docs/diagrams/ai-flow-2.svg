<rect x="208.0" y="780.0" width="304.0" height="88.0" rx="3" fill="#EAF2FB" stroke="#40556B"/>
<text x="360.0" y="814.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">Keep role-specific fields separate;</text>
<text x="360.0" y="828.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">reject emails used as phone numbers.</text>
<text x="360.0" y="842.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">Continue to next field.</text>
<rect x="88.0" y="964.0" width="368.0" height="120.0" rx="3" fill="#F4F6F8" stroke="#40556B"/>
<text x="272.0" y="1014.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#142B42">NO FALLBACK</text>
<text x="272.0" y="1028.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#142B42">All claimant/customer fields</text>
<text x="272.0" y="1042.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#142B42">Claim Number, Claim ID, Claim Type</text>
<rect x="528.0" y="936.0" width="384.0" height="176.0" rx="3" fill="#F4F6F8" stroke="#40556B"/>
<text x="720" y="993.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#142B42">FALLBACK ALLOWED</text>
<text x="720" y="1007.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#142B42">Injury date, jurisdiction, accident description,</text>
<text x="720" y="1021.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#142B42">injury description, diagnosis code</text>
<text x="720" y="1035.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#142B42">All case manager fields</text>
<text x="720" y="1049.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#142B42">Attorney + referral metadata</text>
<text x="720" y="1063.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#142B42">Providers: see page 3</text>
<rect x="624.0" y="620.0" width="272.0" height="184.0" rx="3" fill="#F4F6F8" stroke="#40556B"/>
<text x="760.0" y="681.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#142B42">Optional does not mean fallback is</text>
<text x="760.0" y="695.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#142B42">allowed: claimant Address-line-2</text>
<text x="760.0" y="709.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#142B42">is optional but never uses Special</text>
<text x="760.0" y="723.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#142B42">Instructions. Missing/null/unknown</text>
<text x="760.0" y="737.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#142B42">values normalize to Not found.</text>
<text x="760.0" y="751.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#142B42">Identifiers remain strings.</text>
