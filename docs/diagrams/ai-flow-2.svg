<text x="360.0" y="145.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">For each scalar field: read named-</text>
<text x="360.0" y="159.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">section value from model JSON.</text>
