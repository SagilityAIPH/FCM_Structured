<text x="360.0" y="564.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#142B42">Special Instructions value present?</text>
<rect x="208.0" y="662.0" width="304.0" height="68.0" rx="3" fill="#EAF2FB" stroke="#40556B"/>
